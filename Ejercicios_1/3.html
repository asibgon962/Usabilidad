<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usabilidad en imágenes</title>
  <link rel="stylesheet" href="3.css">
</head>
<body>

  <h1>Usabilidad en las imágenes</h1>

  <p>Imagen optimizada y con etiqueta alt descriptiva:</p>
  <div class="image-container">
    <img src="https://www.eniun.com/wp-content/uploads/Curso-Visual-Studio-Code.png"
         alt="Portada del curso de Visual Studio Code">
  </div>

  <p>Texto con contraste adecuado:</p>
  <div class="background-image">
    <div class="overlay">
      <p>Este texto ahora es completamente legible sobre la imagen de fondo.</p>
    </div>
  </div>

</body>
</html>
