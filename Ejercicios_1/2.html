<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario usable</title>
  <link rel="stylesheet" href="2.css">
</head>
<body>
  <div class="form-container">
    <h1>Formulario de contacto</h1>

    <form>
      <div class="form-field">
        <label for="nombre">Nombre *</label>
        <input id="nombre" type="text" name="nombre" required placeholder="Escribe tu nombre">
      </div>

      <div class="form-field">
        <label for="email">Correo electrónico *</label>
        <input id="email" type="email" name="email" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" name="telefono" placeholder="+34 600 000 000">
      </div>

      <div class="form-field">
        <label for="mensaje">Mensaje *</label>
        <textarea id="mensaje" name="mensaje" required placeholder="Escribe tu mensaje"></textarea>
      </div>

      <button type="submit" class="submit-button">Enviar mensaje</button>
    </form>
  </div>
</body>
</html>
